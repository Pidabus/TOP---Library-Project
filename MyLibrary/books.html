<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="books.js" defer></script>
    <link rel="stylesheet" href="books.css">
    <title>Document</title>
</head>

<body>
    <button command="show-modal" commandfor="my-form">New Book</button>
    <dialog id="my-form">
        <form>
            <label for="book_title">Title: </label>
            <input type="text" id="book_title" name="title">

            <label for="book_author">Title: </label>
            <input type="text" id="book_author" name="title">

            <label for="book_pages">Title: </label>
            <input type="text" id="book_pages" name="title">
        </form>
        <button id="submissionButton" commandfor="my-form" command="close">Submit</button>
    </dialog>

    <div class="container"></div>
</body>

</html>
